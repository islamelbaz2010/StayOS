name: Mobile Android APK Build (non-EAS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Release APK (standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Patch ExpoModulesCorePlugin for Gradle 8 compatibility
        run: |
          sed -i "s/from components\.release/if (components.findByName('release')) { from components.findByName('release') }/g" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle

      - name: Expo prebuild for Android
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Verify release APK exists and contains JS bundle
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          ls -lh "$APK_PATH"
          test -s "$APK_PATH"
          echo "=== APK contents (JS bundle + assets) ==="
          unzip -l "$APK_PATH" | grep -E "index.android.bundle|assets/" || true
          unzip -l "$APK_PATH" | grep -q "index.android.bundle"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stayos-standalone-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        run: |
          {
            echo "### StayOS Android Standalone Release APK"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | 1.0.0 |"
            echo "| Run number | ${{ github.run_number }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Build | non-EAS / local Gradle / release |"
          } >> "$GITHUB_STEP_SUMMARY"
