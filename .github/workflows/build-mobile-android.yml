name: Mobile Android QA APK (Gradle)

# PRIMARY founder-acceptance APK pipeline.
#
#   GitHub Actions → Android SDK/Java/Node → expo prebuild →
#   Gradle assembleRelease → actions/upload-artifact →
#   Actions → run → Artifacts → downloadable APK.
#
# No EXPO_TOKEN / EAS dependency. EAS remains a secondary distribution
# path (`npx eas build --profile qa|preview`) but is never required for
# the acceptance artifact.
#
# `qa` profile (default): staging API + EXPO_PUBLIC_QA_MODE=1 → the
# internal QA role-login panel is compiled in (seeded /auth/dev-token
# accounts; staging-only backend mechanism — 404s on production).
# `release` profile: same app WITHOUT QA controls, still pointing at the
# staging/demo backend (no production backend exists yet — do not point
# this at prod until one does).

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-mobile-android.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (qa = internal QA panel | release = no QA controls)'
        required: false
        default: 'qa'
        type: choice
        options:
          - qa
          - release

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK via Gradle (${{ github.event.inputs.profile || 'qa' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_API_URL: https://stayos-demo-production.up.railway.app/api/v1
      BUILD_PROFILE: ${{ github.event.inputs.profile || 'qa' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Patch ExpoModulesCorePlugin for Gradle 8 compatibility
        run: |
          sed -i "s/from components\.release/if (components.findByName('release')) { from components.findByName('release') }/g" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle

      - name: Enable QA mode (qa profile only)
        if: env.BUILD_PROFILE == 'qa'
        run: echo "EXPO_PUBLIC_QA_MODE=1" >> "$GITHUB_ENV"

      - name: Expo prebuild for Android
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Verify release APK exists and contains JS bundle
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          ls -lh "$APK_PATH"
          test -s "$APK_PATH"
          unzip -l "$APK_PATH" | grep -q "index.android.bundle"

      - name: Read app metadata + rename APK
        id: meta
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          PACKAGE=$(node -p "require('./app.json').expo.android.package")
          SDK=$(node -p "require('./package.json').dependencies.expo.replace(/[^0-9.]/g,'')")
          SHORT_SHA="${GITHUB_SHA:0:7}"
          PROF=$(echo "$BUILD_PROFILE" | tr 'a-z' 'A-Z')
          APK_NAME="StayOS-Android-${PROF}-${SHORT_SHA}.apk"
          mv "android/app/build/outputs/apk/release/app-release.apk" "$APK_NAME"
          ls -lh "$APK_NAME"
          {
            echo "version=$VERSION"
            echo "package=$PACKAGE"
            echo "sdk=$SDK"
            echo "apk_name=$APK_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: apps/mobile/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        run: |
          {
            echo "### StayOS Android APK — Gradle (${BUILD_PROFILE})"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Branch | ${GITHUB_REF_NAME} |"
            echo "| Build type | GitHub Actions → expo prebuild → Gradle assembleRelease |"
            echo "| Designation | ${BUILD_PROFILE} (internal QA acceptance — not for store) |"
            echo "| Android package | ${{ steps.meta.outputs.package }} |"
            echo "| App version | ${{ steps.meta.outputs.version }} |"
            echo "| Expo SDK | ${{ steps.meta.outputs.sdk }} |"
            echo "| API environment | ${EXPO_PUBLIC_API_URL} |"
            echo "| Artifact | ${{ steps.meta.outputs.apk_name }} |"
            echo "| Workflow run | ${{ github.run_number }} |"
            echo ""
            echo "Download the APK from this run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"
