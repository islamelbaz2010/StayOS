name: Mobile Android APK Build

# Builds the StayOS Android APK via EAS (the authoritative Expo build
# mechanism — no committed native android/ directory) and persists the
# APK as a normal GitHub Actions artifact: Actions → run → Artifacts.
#
# Default profile is `qa` (internal acceptance build — exposes the
# seeded-account QA login section). `preview` builds the same APK without
# QA controls; `production` stays an AAB and is not used here.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (qa | preview)'
        required: false
        default: 'qa'
        type: choice
        options:
          - qa
          - preview

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (EAS ${{ github.event.inputs.profile || 'qa' }} profile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EAS_PROFILE: ${{ github.event.inputs.profile || 'qa' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify EXPO_TOKEN secret is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Required secret EXPO_TOKEN is not set."
            echo "::error::EAS CLI authenticates non-interactively via the EXPO_TOKEN environment variable."
            echo "::error::Create a token at https://expo.dev/accounts/islamelbaz/settings/access-tokens"
            echo "::error::and add it as a repository secret named EXPO_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Read app metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          PACKAGE=$(node -p "require('./app.json').expo.android.package")
          SDK=$(node -p "require('./package.json').dependencies.expo.replace(/[^0-9.]/g,'')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"

      - name: Trigger EAS Build
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas build \
            --platform android \
            --profile "$EAS_PROFILE" \
            --non-interactive \
            --json > eas-build-result.json

          node -e "
            const b = require('./eas-build-result.json')[0];
            const url = b.artifacts && b.artifacts.buildUrl;
            if (!url) {
              console.error('EAS build did not return a downloadable artifact URL.');
              process.exit(1);
            }
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              'apk_url=' + url + '\n' + 'build_id=' + b.id + '\n');
            console.log('EAS build id:', b.id);
            console.log('APK url:', url);
          "

      - name: Download built APK
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          APK_NAME="StayOS-Android-${SHORT_SHA}-${{ steps.eas_build.outputs.build_id }}.apk"
          curl -fSL -o "$APK_NAME" "${{ steps.eas_build.outputs.apk_url }}"
          ls -lh "$APK_NAME"
          test -s "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_ENV"

      - name: Write build summary
        run: |
          {
            echo "### StayOS Android APK (${EAS_PROFILE})"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| App version | ${{ steps.meta.outputs.version }} |"
            echo "| Expo SDK | ${{ steps.meta.outputs.sdk }} |"
            echo "| Android package | ${{ steps.meta.outputs.package }} |"
            echo "| EAS profile | ${EAS_PROFILE} |"
            echo "| EAS build ID | ${{ steps.eas_build.outputs.build_id }} |"
            echo "| Artifact | ${APK_NAME} |"
            echo ""
            echo "Download the APK from this run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: apps/mobile/${{ env.APK_NAME }}
          retention-days: 30
          if-no-files-found: error
