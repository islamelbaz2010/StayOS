version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.3-alpine
    container_name: stayos_staging_postgres
    environment:
      POSTGRES_USER: stayos
      POSTGRES_PASSWORD: stayos
      POSTGRES_DB: stayos
    volumes:
      - stayos_staging_postgres_data:/var/lib/postgresql/data
    networks:
      - stayos_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayos"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: stayos_staging_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - stayos_staging_redis_data:/data
    networks:
      - stayos_staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    image: stayos/api:staging
    container_name: stayos_staging_migrate
    env_file:
      - .env.staging
    networks:
      - stayos_staging
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    profiles:
      - migrate

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    image: stayos/api:staging
    container_name: stayos_staging_api
    ports:
      - "8000:8000"
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stayos_staging
    command:
      - "uvicorn"
      - "app.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--workers"
      - "2"
      - "--proxy-headers"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  worker:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    image: stayos/api:staging
    container_name: stayos_staging_worker
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stayos_staging
    command:
      - "celery"
      - "-A"
      - "app.celery_app"
      - "worker"
      - "--loglevel=info"
      - "-Q"
      - "high,default,low"
      - "--concurrency=2"
      - "--max-tasks-per-child=1000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "celery -A app.celery_app inspect ping || exit 1"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  beat:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    image: stayos/api:staging
    container_name: stayos_staging_beat
    env_file:
      - .env.staging
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks:
      - stayos_staging
    command:
      - "celery"
      - "-A"
      - "app.celery_app"
      - "beat"
      - "--loglevel=info"
      - "--scheduler"
      - "celery.beat.PersistentScheduler"
      - "-s"
      - "/tmp/celerybeat-schedule"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  stayos_staging_postgres_data:
    driver: local
  stayos_staging_redis_data:
    driver: local

networks:
  stayos_staging:
    driver: bridge
